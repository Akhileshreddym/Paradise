<!doctype html>
<!-- Nudge "beacon": the phone you walk to. Shares its GPS location with the laptop. Needs https. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge · Beacon</title>
<link rel="stylesheet" href="nudge.css">
<style>
  .stack { display: grid; gap: 16px; }
  .intro p { margin: 0 0 16px; color: var(--muted); }
  .fix { text-align: center; padding: 28px 20px; }
  .fix .big { margin: 6px 0 4px; font-size: 64px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .fix[data-state="ok"] .big { color: var(--green); }
  .fix[data-state="warn"] .big { color: var(--orange); }
  .fix[data-state="bad"] .big { color: var(--red); }
  .fix .mono { margin-top: 12px; }
  .note { border-color: color-mix(in srgb, var(--orange) 45%, transparent); background: color-mix(in srgb, var(--orange) 10%, var(--card)); }
</style>
</head>
<body>
<div class="wrap narrow">
  <header class="top">
    <div class="brand"><span class="mark"></span>Nudge <span class="sub">Beacon</span></div>
    <span class="pill" id="net">Connecting…</span>
  </header>
  <div class="stack">
    <section class="card intro" id="intro">
      <p>This phone plays the Waymo. Put it in or on the car the wearer should walk to, outdoors if you
        can. Keep the screen on and this page open.</p>
      <button id="start" class="primary big">Start sharing location</button>
    </section>
    <section class="card fix" id="fix" hidden>
      <div class="label">GPS accuracy</div>
      <div class="big" id="acc">—</div>
      <div class="muted" id="age">Waiting for GPS…</div>
      <div class="mono" id="coords"></div>
    </section>
    <section class="card note" id="info" hidden></section>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const note = (text) => { $("info").textContent = text; $("info").hidden = !text; };

  // The pill in the header: can the server hear us?
  let ws = null;
  function connect() {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=beacon`);
    ws.onopen = () => { $("net").textContent = "Connected"; $("net").className = "pill ok"; };
    ws.onclose = () => { $("net").textContent = "Reconnecting…"; $("net").className = "pill bad"; setTimeout(connect, 1000); };
  }
  connect();

  let gps = null; // { lat, lon, acc, time }
  let watch = null;
  $("start").onclick = () => {
    if (!navigator.geolocation) { note("No GPS in this browser."); return; }
    $("intro").hidden = true;
    $("fix").hidden = false;
    note("");
    watch = navigator.geolocation.watchPosition(
      // Arrival time, not p.timestamp: Safari counts that from 2001, not 1970, so fixes look 31 years old.
      (p) => {
        gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, time: Date.now() };
        if ($("info").textContent.startsWith("GPS error")) note(""); // a timeout earlier, fine now
      },
      (err) => {
        note(`GPS error: ${err.message}`);
        // Refused: give the button back, so allowing location and tapping again works without a reload.
        if (err.code === err.PERMISSION_DENIED) { navigator.geolocation.clearWatch(watch); $("intro").hidden = false; $("fix").hidden = true; }
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 },
    );
    keepAwake();
  };
  // Keep the screen on. The browser drops the lock whenever the page is hidden (another app, the
  // lock screen), so take it again when the page comes back.
  let wantAwake = false;
  async function keepAwake() {
    wantAwake = true;
    try { await navigator.wakeLock?.request("screen"); } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (wantAwake && document.visibilityState === "visible") keepAwake(); });

  // Send the latest fix once a second, with its age so the laptop knows how fresh it is.
  setInterval(() => {
    if (!gps) return;
    const age = Math.max(0, Date.now() - gps.time);
    $("acc").textContent = `±${gps.acc.toFixed(0)} m`;
    $("fix").dataset.state = gps.acc <= 10 ? "ok" : gps.acc <= 100 ? "warn" : "bad";
    $("age").textContent = `Updated ${(age / 1000).toFixed(0)} s ago`;
    $("coords").textContent = `${gps.lat.toFixed(6)}, ${gps.lon.toFixed(6)}`;
    if (gps.acc > 100) note("Accuracy is very low. iPhone: Settings → Privacy & Security → Location Services → Safari Websites → turn on Precise Location.");
    else if ($("info").textContent.startsWith("Accuracy")) note("");
    if (ws?.readyState === 1) {
      ws.send(JSON.stringify({ type: "beacon", lat: gps.lat, lon: gps.lon, acc: gps.acc, age }));
    }
  }, 1000);
</script>
</body>
</html>
