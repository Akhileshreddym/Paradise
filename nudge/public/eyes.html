<!doctype html>
<!-- Nudge "eyes": phone page. Finds objects with YOLO (cars, people, chairs…) and sends their
     angle + distance to the laptop, with GPS and compass. Up close to the car, the laptop asks
     for camera frames, and the server finds the door handle in them. Needs https. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge · Eyes</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 12px; background: #111; color: #eee; }
  button { font-size: 20px; padding: 12px 18px; margin: 4px 0; }
  input { font-size: 16px; width: 90px; }
  canvas { width: 100%; height: auto; display: block; background: #000; margin-top: 8px; }
  #info { font: 700 22px/1.4 monospace; margin-top: 8px; white-space: pre; }
  .row { margin: 8px 0; }
</style>
</head>
<body>
<button id="start">Start (camera + GPS + compass)</button>
<div class="row">
  Focal (px): <input id="focal" type="number" step="1" value="720">
  Person height (m): <input id="personH" type="number" step="0.01" value="1.70"><br>
  <button id="calib">Calibrate: that person standing exactly 3.00 m away</button>
</div>
<div id="yoloInfo" style="font-family: monospace">objects: starts with Start</div>
<div id="net" style="font: 700 20px/1.6 monospace; padding: 4px 10px; border-radius: 6px; background: #a00">LAPTOP: NOT CONNECTED</div>
<div id="sensors" style="font-family: monospace">GPS: off · compass: off</div>
<div id="info">tap Start</div>
<canvas id="view"></canvas>
<video id="video" playsinline muted style="display:none"></video>

<script>
  const $ = (id) => document.getElementById(id);
  const video = $("video"), view = $("view"), ctx = view.getContext("2d");
  // Remember settings on this phone (browser storage can be blocked; that's fine).
  try {
    if (localStorage.getItem("focal960")) $("focal").value = localStorage.getItem("focal960");
    if (localStorage.getItem("personH")) $("personH").value = localStorage.getItem("personH");
  } catch {}
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  $("focal").onchange = () => save("focal960", $("focal").value); // focal is in 960 px frame pixels
  $("personH").onchange = () => save("personH", $("personH").value);

  // ---- Link to the laptop ----
  let ws = null;
  function connect() {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=eyes`);
    ws.onclose = () => setTimeout(connect, 1000);
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === "frame-please") sendFrame(msg.id);
    };
  }
  connect();

  // ---- Compass: which way the rear camera faces, degrees clockwise from (magnetic) north ----
  let compass = null;
  async function startCompass() {
    const D = window.DeviceOrientationEvent;
    if (!D) return;
    // iPhone only shows this permission prompt when it's called straight from a tap.
    if (typeof D.requestPermission === "function") {
      try { if ((await D.requestPermission()) !== "granted") return; } catch { return; }
    }
    // iPhone: webkitCompassHeading is the rear camera's direction when the phone is upright.
    window.addEventListener("deviceorientation", (e) => {
      if (typeof e.webkitCompassHeading === "number") compass = e.webkitCompassHeading;
    });
    // Android: absolute orientation, converted to the rear camera's direction.
    window.addEventListener("deviceorientationabsolute", (e) => {
      if (e.alpha !== null) compass = rearCameraHeading(e.alpha, e.beta, e.gamma);
    });
  }
  // W3C DeviceOrientation spec's formula: horizontal direction of the vector out of the back
  // of the phone, from alpha/beta/gamma (alpha counter-clockwise from north).
  function rearCameraHeading(alpha, beta, gamma) {
    const r = Math.PI / 180, a = alpha * r, b = beta * r, g = gamma * r;
    const east = -Math.cos(a) * Math.sin(g) - Math.sin(a) * Math.sin(b) * Math.cos(g);
    const north = -Math.sin(a) * Math.sin(g) + Math.cos(a) * Math.sin(b) * Math.cos(g);
    return ((Math.atan2(east, north) * 180) / Math.PI + 360) % 360;
  }

  // ---- GPS ----
  let gps = null, gpsError = "";
  function startGps() {
    if (!navigator.geolocation) { gpsError = "not available"; return; }
    navigator.geolocation.watchPosition(
      // Arrival time, not p.timestamp: Safari counts that from 2001, not 1970, so fixes look 31 years old.
      (p) => { gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, time: Date.now() }; gpsError = ""; },
      (err) => (gpsError = err.message),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 },
    );
  }
  setInterval(() => {
    const g = gps ? `±${gps.acc.toFixed(0)} m` : gpsError || "waiting…";
    $("sensors").textContent = `GPS: ${g} · compass: ${compass === null ? "—" : compass.toFixed(0) + "°"}`;
  }, 500);

  // ---- Camera ----
  $("start").onclick = async () => {
    $("start").style.display = "none";
    await startCompass(); // first, while the tap still counts on iPhone
    startGps();
    startYolo();
    try { await navigator.wakeLock?.request("screen"); } catch {} // keep the screen on
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      requestAnimationFrame(loop);
    } catch (err) {
      // GPS mode still works without the camera.
      $("info").textContent = `camera error: ${err.name}\n${err.message}\n(the page must be https)`;
    }
  };

  // Preview + measurements in a 960 px frame (longest side); focal is in these pixels.
  let lastDraw = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - lastDraw < 66 || !video.videoWidth) return; // ~15 a second
    lastDraw = now;
    const k = 960 / Math.max(video.videoWidth, video.videoHeight);
    const W = Math.round(video.videoWidth * k), H = Math.round(video.videoHeight * k);
    if (view.width !== W) { view.width = W; view.height = H; }
    ctx.drawImage(video, 0, 0, W, H);
    sendFrameToYolo(W);
    draw();
    const sign = (a) => `${a >= 0 ? "+" : ""}${a.toFixed(0)}°`;
    const lines = performance.now() - yolo.at < 1500 ? yolo.objects.map((o) =>
      `${o.label} ${Math.round(o.score * 100)}%  ${sign(o.angle)}${o.distance ? `  ${o.distance.toFixed(1)} m` : ""}`) : [];
    $("info").textContent = lines.join("\n") || "nothing found";
  }

  function draw() {
    ctx.lineWidth = 3;
    ctx.font = "bold 20px monospace";
    if (performance.now() - yolo.at < 1500) { // last result (YOLO runs slower than the preview)
      ctx.strokeStyle = ctx.fillStyle = "#0cf";
      for (const b of yolo.boxes) {
        ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
        ctx.fillText(`${b.label} ${Math.round(b.score * 100)}%`, b.x1 + 4, b.y1 + 22);
      }
    }
    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.moveTo(view.width / 2, 0); ctx.lineTo(view.width / 2, view.height); ctx.stroke();
  }

  // ---- Objects: YOLOv10n in yolo-worker.js ----
  // Distance comes from the box's height, which barely changes with viewing angle (a car is
  // 1.9 m wide head-on but 4.7 m long from the side). Up close the box runs off the frame, so
  // the distance then reads long. Heights in meters; classes not listed get no distance.
  const HEIGHTS = { car: 1.6, truck: 3.0, bus: 3.2, person: 1.7, chair: 0.9, bench: 0.8, "fire hydrant": 0.7 };
  const yolo = { worker: null, busy: false, scale: 1, boxes: [], objects: [], at: -Infinity, fresh: false };
  function startYolo() {
    if (yolo.worker) return;
    $("yoloInfo").textContent = "objects: loading model (about 30 MB the first time)…";
    yolo.worker = new Worker("yolo-worker.js", { type: "module" });
    yolo.worker.onerror = (e) => ($("yoloInfo").textContent = `objects: worker failed: ${e.message || "see console"}`);
    yolo.worker.onmessage = ({ data }) => {
      if (data.type === "ready") $("yoloInfo").textContent = `objects: model ready (${data.backend})`;
      else if (data.type === "error") $("yoloInfo").textContent = `objects: model failed to load: ${data.message}`;
      else onBoxes(data);
    };
  }
  // One frame in flight at a time, so a slow phone just gets fewer object updates.
  function sendFrameToYolo(W) {
    if (!yolo.worker || yolo.busy) return;
    yolo.busy = true;
    createImageBitmap(video).then((bitmap) => {
      yolo.scale = W / bitmap.width; // worker answers in camera pixels; we measure in 960 px frame pixels
      yolo.worker.postMessage({ bitmap, minScore: 0.35 }, [bitmap]);
    }, () => (yolo.busy = false));
  }
  function onBoxes({ boxes, ms, backend, error }) {
    yolo.busy = false;
    const s = yolo.scale, f = Number($("focal").value), W = view.width;
    HEIGHTS.person = Number($("personH").value) || 1.7;
    yolo.boxes = boxes.map((b) => ({ ...b, x1: b.x1 * s, y1: b.y1 * s, x2: b.x2 * s, y2: b.y2 * s }));
    yolo.objects = yolo.boxes.map((b) => ({
      label: b.label,
      score: Math.round(b.score * 100) / 100,
      angle: (Math.atan(((b.x1 + b.x2) / 2 - W / 2) / f) * 180) / Math.PI,
      distance: HEIGHTS[b.label] ? (f * HEIGHTS[b.label]) / (b.y2 - b.y1) : null,
    }));
    yolo.at = performance.now();
    yolo.fresh = true;
    $("yoloInfo").textContent = error ? `objects: ${error}` : `objects: ${backend}, ${ms.toFixed(0)} ms a frame`;
  }

  // Calibration: a person of known height exactly 3.00 m away → focal = box height × 3.00 / height.
  $("calib").onclick = () => {
    const people = yolo.boxes.filter((b) => b.label === "person");
    if (!people.length || performance.now() - yolo.at > 1500) { alert("Point the camera at the person first (whole body in view)."); return; }
    const tallest = Math.max(...people.map((b) => b.y2 - b.y1));
    const f = Math.round((tallest * 3.0) / (Number($("personH").value) || 1.7));
    $("focal").value = f;
    save("focal960", f);
  };

  // ---- Camera frames for the door handle finder (in server.js) ----
  // The laptop page asks for one frame at a time, only when the wearer is close to the car.
  // 800 px: what the handle model works at anyway, and ~80 KB as JPEG.
  const snap = document.createElement("canvas");
  function sendFrame(id) {
    if (!video.videoWidth || ws?.readyState !== 1) return;
    const k = 800 / Math.max(video.videoWidth, video.videoHeight);
    snap.width = Math.round(video.videoWidth * k);
    snap.height = Math.round(video.videoHeight * k);
    snap.getContext("2d").drawImage(video, 0, 0, snap.width, snap.height);
    ws.send(JSON.stringify({
      type: "frame", to: "server", id, w: snap.width, h: snap.height,
      image: snap.toDataURL("image/jpeg", 0.7),
      focal: (Number($("focal").value) * 800) / 960, // in this frame's pixels
    }));
  }

  // ---- Send ~10 updates a second ----
  // Big green/red badge: is the laptop actually getting our updates?
  let seq = 0;
  setInterval(() => {
    const up = ws?.readyState === 1;
    $("net").style.background = up ? "#070" : "#a00";
    $("net").textContent = up ? `LAPTOP: CONNECTED · ${seq} updates sent` : "LAPTOP: NOT CONNECTED (reconnecting…)";
  }, 500);
  setInterval(() => {
    if (ws?.readyState !== 1) return;
    ws.send(JSON.stringify({
      type: "eyes",
      seq: ++seq,
      // Only when there's a new result: the laptop turns each one into a heading once, and a
      // repeat would be read against wherever the wearer faces by then.
      objects: yolo.fresh ? ((yolo.fresh = false), yolo.objects) : undefined,
      compass,
      gps: gps && { lat: gps.lat, lon: gps.lon, acc: gps.acc, age: Math.max(0, Date.now() - gps.time) },
    }));
  }, 100);
</script>
</body>
</html>
