<!doctype html>
<!-- Paradise "beacon": the phone that stands in for the Waymo car at pickup. Shares its GPS location
     with the laptop. Needs https. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>Paradise · Beacon</title>
<link rel="stylesheet" href="paradise.css">
<script src="appearance.js"></script>
<style>
  /* Paradise beacon, on top of paradise.css: a Waymo pickup screen for one phone — a glowing teal
     ring around a drawn car, one big headline, a single primary action, then the GPS fix as a big
     light numeral with a status capsule and a couple of detail rows. One narrow column, clear of the
     notch and the home bar. */
  .page {
    --gutter: max(20px, env(safe-area-inset-left), env(safe-area-inset-right));
    max-width: 480px; margin: 0 auto;
    padding: 0 var(--gutter) max(28px, env(safe-area-inset-bottom));
    min-height: 100svh; display: flex; flex-direction: column;
  }

  /* ---- Masthead: wordmark, the link to the laptop as a dot and a word, appearance ---- */
  .masthead {
    display: flex; align-items: center; gap: 14px;
    min-height: calc(60px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
    border-bottom: 1px solid var(--line);
  }
  .masthead .brand { gap: 10px; min-width: 0; }
  .masthead .brand-word { font-size: 11.5px; letter-spacing: 0.42em; }
  .masthead .brand .sub { font-size: 15px; }
  .masthead-right { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .masthead .pill { max-width: 44vw; overflow: hidden; text-overflow: ellipsis; }
  .masthead .icon-button { width: 36px; min-height: 36px; margin-right: -8px; border-color: transparent; background: transparent; color: var(--muted); }

  /* ---- The pickup screen: a glowing pin behind a drawn car, then the headline ---- */
  .pickup { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 0 0; }
  .pin { position: relative; width: 168px; height: 168px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; flex: none; }
  .pin::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, var(--guide-soft), transparent 68%);
    animation: pin-breathe 2.6s var(--ease-in-out) infinite;
  }
  .pin::after {
    content: ""; position: absolute; inset: 30px; border-radius: 50%;
    box-shadow: 0 0 0 1.5px var(--guide-soft), 0 0 44px 6px var(--guide-soft);
    transition: box-shadow 300ms var(--ease-out);
  }
  .pin svg { position: relative; width: 84px; height: 84px; color: var(--guide); transition: color 300ms var(--ease-out); }
  @keyframes pin-breathe { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.04); opacity: 1; } }
  .page:has(#fix[data-state="ok"]) .pin::before { background: radial-gradient(circle, var(--go-soft), transparent 68%); }
  .page:has(#fix[data-state="ok"]) .pin::after { box-shadow: 0 0 0 1.5px var(--go-soft), 0 0 44px 6px var(--go-soft); }
  .page:has(#fix[data-state="ok"]) .pin svg { color: var(--go); }
  .page:has(#fix[data-state="warn"]) .pin::before { background: radial-gradient(circle, color-mix(in srgb, var(--wait) 30%, transparent), transparent 68%); }
  .page:has(#fix[data-state="warn"]) .pin::after { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--wait) 30%, transparent), 0 0 44px 6px color-mix(in srgb, var(--wait) 24%, transparent); }
  .page:has(#fix[data-state="warn"]) .pin svg { color: var(--wait); }
  .page:has(#fix[data-state="bad"]) .pin::before { background: radial-gradient(circle, var(--stop-soft), transparent 68%); }
  .page:has(#fix[data-state="bad"]) .pin::after { box-shadow: 0 0 0 1.5px var(--stop-soft), 0 0 44px 6px var(--stop-soft); }
  .page:has(#fix[data-state="bad"]) .pin svg { color: var(--stop); }

  .headline { font: 400 clamp(32px, 8vw, 44px)/1.08 var(--font); letter-spacing: -0.02em; }
  .lede { margin: 10px 0 0; max-width: 34ch; font-size: 14.5px; line-height: 1.5; color: var(--muted); }

  /* ---- Setup: the one button ---- */
  .intro { width: 100%; max-width: 320px; margin-top: 30px; }
  #start { width: 100%; min-height: 56px; font-size: 15.5px; gap: 10px; }
  .hint { margin: 14px 0 0; font-size: 12px; color: var(--faint); }

  /* ---- Sharing: a status capsule, one big light numeral, the detail rows ---- */
  .fix { width: 100%; margin-top: 30px; text-align: left; }
  .fix .quality-row { display: flex; justify-content: center; }
  #quality::after { content: "Searching for GPS"; }
  #fix[data-state] #quality { color: var(--text); }
  #fix[data-state="ok"] #quality::before { background: var(--go); box-shadow: 0 0 8px var(--go); }
  #fix[data-state="ok"] #quality::after { content: "Sending location"; }
  #fix[data-state="warn"] #quality::before { background: var(--wait); }
  #fix[data-state="warn"] #quality::after { content: "Rough fix"; }
  #fix[data-state="bad"] #quality::before { background: var(--stop); }
  #fix[data-state="bad"] #quality::after { content: "Poor fix"; }

  .acc {
    margin: 18px 0 6px; text-align: center;
    font: 400 clamp(76px, 24vw, 116px)/0.92 var(--font); letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; color: var(--muted); transition: color 300ms var(--ease-out);
  }
  #fix[data-state="ok"] .acc { color: var(--go); }
  #fix[data-state="warn"] .acc { color: var(--wait); }
  #fix[data-state="bad"] .acc { color: var(--stop); }

  .fix .rows { margin-top: 8px; }
  .fix .rows b { font: 500 13.5px/1 var(--font); }
  #fix[data-state="ok"] .rows i { background: var(--go); box-shadow: 0 0 8px var(--go); }
  #fix[data-state="warn"] .rows i { background: var(--wait); }
  #fix[data-state="bad"] .rows i { background: var(--stop); }

  /* ---- A note: quiet, amber accent ---- */
  .note {
    width: 100%; margin-top: 22px; padding: 14px 16px; border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--wait) 12%, var(--surface)); color: var(--text);
    font-size: 13.5px; line-height: 1.5; text-align: left;
  }

  .foot { margin-top: auto; padding: 28px 0 6px; text-align: center; font-size: 12px; color: var(--faint); }

  @media (hover: hover) and (pointer: fine) {
    .masthead .icon-button:hover { color: var(--text); background: var(--surface-2); }
  }
  @media (min-width: 760px) { .pickup { padding-top: 64px; } }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <a class="brand" href="/" aria-label="Paradise, Beacon"><span class="brand-word">PAR<em>A</em>DISE</span><span class="sub">Beacon</span></a>
    <div class="masthead-right">
      <span class="pill" id="net" role="status">Connecting…</span>
      <button class="icon-button ghost" data-theme-toggle aria-label="Switch appearance" title="Switch appearance"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    </div>
  </header>

  <main class="pickup" aria-label="Destination phone">
    <div class="pin" aria-hidden="true">
      <svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 26h3.5l3.6-8.6A4 4 0 0 1 16.8 15h30.4a4 4 0 0 1 3.7 2.4L54.5 26H58a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-3"/>
        <path d="M6 26v5a2 2 0 0 0 2 2h3"/>
        <path d="M13 26h38"/>
        <circle cx="19" cy="33" r="4"/>
        <circle cx="45" cy="33" r="4"/>
      </svg>
    </div>
    <h1 class="headline">Waymo pickup</h1>
    <p class="lede">Put this phone where the wearer should walk to. It shares its location with the laptop.</p>

    <section class="intro" id="intro" aria-label="Setup">
      <button id="start" class="primary">Share location <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
      <p class="hint">Outdoors, with Precise Location on, works best.</p>
    </section>

    <section class="fix" id="fix" hidden aria-label="GPS fix">
      <div class="quality-row"><span class="pill" id="quality" aria-hidden="true"></span></div>
      <div class="acc" id="acc" aria-live="polite">—</div>
      <div class="rows">
        <div><i></i><span>Updated</span><b id="age">Waiting for GPS…</b></div>
        <div><i></i><span>Location</span><b id="coords"></b></div>
      </div>
    </section>

    <section class="note" id="info" role="status" hidden></section>

    <p class="foot">Keep this page open</p>
  </main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const note = (text) => { $("info").textContent = text; $("info").hidden = !text; };

  // The pill in the header: can the server hear us? The link npm start prints ends in ?k=…, a key:
  // the server only lets a phone in through the tunnel with it (anyone can come across a tunnel
  // address). Passed on to the WebSocket.
  const LINK_KEY = new URLSearchParams(location.search).get("k") || "";
  const REFUSED = "Wrong or missing link: reopen the link printed by npm start (it ends in ?k=…).";
  let ws = null;
  function connect() {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=beacon&k=${encodeURIComponent(LINK_KEY)}`);
    ws.onopen = () => {
      $("net").textContent = "Connected"; $("net").className = "pill ok";
      if ($("info").textContent === REFUSED) note("");
    };
    // Refused for the key: trying again every second won't help (only the right link will), so every 5 s.
    ws.onclose = (e) => {
      const refused = e.code === 4401;
      $("net").textContent = refused ? "Wrong link" : "Reconnecting…"; $("net").className = "pill bad";
      if (refused) note(REFUSED);
      setTimeout(connect, refused ? 5000 : 1000);
    };
  }
  connect();

  let gps = null; // { lat, lon, acc, time }
  let watch = null;
  $("start").onclick = () => {
    if (!navigator.geolocation) { note("No GPS in this browser."); return; }
    $("intro").hidden = true;
    $("fix").hidden = false;
    note("");
    watch = navigator.geolocation.watchPosition(
      // Arrival time, not p.timestamp: Safari counts that from 2001, not 1970, so fixes look 31 years old.
      (p) => {
        gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, time: Date.now() };
        if ($("info").textContent.startsWith("GPS error")) note(""); // a timeout earlier, fine now
      },
      (err) => {
        note(`GPS error: ${err.message}`);
        // Refused: give the button back, so allowing location and tapping again works without a reload.
        if (err.code === err.PERMISSION_DENIED) { navigator.geolocation.clearWatch(watch); $("intro").hidden = false; $("fix").hidden = true; }
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 },
    );
    keepAwake();
  };
  // Keep the screen on. The browser drops the lock whenever the page is hidden (another app, the
  // lock screen), so take it again when the page comes back.
  let wantAwake = false;
  async function keepAwake() {
    wantAwake = true;
    try { await navigator.wakeLock?.request("screen"); } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (wantAwake && document.visibilityState === "visible") keepAwake(); });

  // Send the latest fix once a second, with its age so the laptop knows how fresh it is.
  setInterval(() => {
    if (!gps) return;
    const age = Math.max(0, Date.now() - gps.time);
    $("acc").textContent = `±${gps.acc.toFixed(0)} m`;
    $("fix").dataset.state = gps.acc <= 10 ? "ok" : gps.acc <= 100 ? "warn" : "bad";
    $("age").textContent = `Updated ${(age / 1000).toFixed(0)} s ago`;
    $("coords").textContent = `${gps.lat.toFixed(6)}, ${gps.lon.toFixed(6)}`;
    if (gps.acc > 100) note("Accuracy is very low. iPhone: Settings → Privacy & Security → Location Services → Safari Websites → turn on Precise Location.");
    else if ($("info").textContent.startsWith("Accuracy")) note("");
    if (ws?.readyState === 1) {
      ws.send(JSON.stringify({ type: "beacon", lat: gps.lat, lon: gps.lon, acc: gps.acc, age }));
    }
  }, 1000);
</script>
</body>
</html>
